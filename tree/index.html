hildren\":[\"$\",\"$L1e\",null,{}]}]\n11:[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L8\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L9\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}]\n"])</script><script>self.__next_f.push([1,"12:[\"$\",\"$1\",\"c\",{\"children\":[[\"$\",\"$L1f\",null,{\"posts\":[{\"id\":\"city-edge\",\"slug\":\"city-edge\",\"title\":\"拍摄《城市边缘》的三个月：那些在城市角落生活的人们\",\"type\":\"post\",\"date\":\"2026-08-08 18:20:00\",\"cover\":\"/bg1.jpg\",\"content\":\"## 为什么要拍这个题材\\n\\n《城市边缘》是一部关于城市边缘群体的纪录片。做这个选题的初衷很简单：我们每天生活在这座城市里，但对它角落里的另一群人几乎一无所知。\\n\\n## 三个月的拍摄\\n\\n凌晨四点的菜市场，摊主们已经开始一天的生计。地下通道里的流浪歌手，一首歌唱完会对着空荡荡的通道鞠躬。城中村的出租屋，隔音很差，隔壁的说话声和电视机的声音清晰可闻。24小时便利店的夜班店员，说最怕的是凌晨两点到四点那段没人来的时间。\\n\\n这些画面，我以前从没认真看过。\\n\\n## 最触动我的几个瞬间\\n\\n采访了三十多位受访者。有几位让我至今难忘：\\n\\n一位收废品的阿姨，聊到女儿考上大学时眼睛亮了一下，说\\\"再苦也值了\\\"。\\n\\n一位夜班出租车司机，说城市最真实的时刻是凌晨，那时候路上的车都不赶时间。\\n\\n一位在工地干了二十年的师傅，说想带孙子来看看自己盖的大楼。\\n\\n## 记录的意义\\n\\n拍完之后我一直在想，纪录片能改变什么？后来我想明白了，改变不改变是另一回事，**看见**本身就是意义。有人看见了，就有人记住了。\\n\\n这部片子目前进入后期制作阶段，希望早日和大家见面。\"},{\"id\":\"first\",\"slug\":\"first\",\"title\":\"当创作者开始学编程：影像与代码的共通之处\",\"type\":\"post\",\"date\":\"2026-09-05 09:00:00\",\"cover\":\"/avatar.jpg\",\"content\":\"## 为什么一个拍片子的人开始写代码\\n\\n很多人听到\\\"纪录片导演学编程\\\"这个组合，第一反应都是：这俩有关系吗？\\n\\n其实关系大得很。\\n\\n## 影像和代码的共通点\\n\\n**都是表达世界的语言。** 镜头语言用画面说话，代码用逻辑说话。一个记录真实，一个创造可能。\\n\\n**都是反复打磨的过程。** 一个镜头可能拍二十遍才满意，一段代码可能重构三次才清爽。那种\\\"终于对了\\\"的感觉，一模一样。\\n\\n**都是解决问题的过程。** 拍摄现场总有意外，光线不对、演员状态不好、设备出问题——你要在有限条件下找到最优解。写代码也一样，需求会变、bug会来，你要做的是拆解问题、逐个击破。\\n\\n## 学习过程并没有想象中难\\n\\n说实话，一开始我也以为编程是另一座山。真的学起来才发现，很多概念跟拍片子是相通的：\\n\\n- 函数就像分镜脚本，一段逻辑负责一件事\\n- 数据就像素材，要整理好才能剪辑\\n- 调试就像后期调色，一点一点逼近想要的效果\\n\\n每一次解决问题的成就感，和拍出一个好镜头时的感觉是一样的。\\n\\n## 写给同样想跨界的人\\n\\n别怕\\\"从零开始\\\"。你已有的任何领域的经验，都会在另一个领域给你意想不到的助力。跨界不是从零出发，而是带着一身装备，换一条路走。\"},{\"id\":\"frontend-social\",\"slug\":\"frontend-social\",\"title\":\"纯前端也能做社交平台？我的微圈扩列开发记录\",\"type\":\"post\",\"date\":\"2026-06-22 20:00:00\",\"cover\":\"/avatar.jpg\",\"content\":\"## 一开始没人信\\n\\n当我说要做社交平台的时候，所有人都说：社交平台怎么可能没有后端？用户数据放哪？聊天消息怎么存？登录认证怎么办？\\n\\n说实话，我一开始也觉得不太可能。直到我找到了第三方存储方案。\\n\\n## 技术选型\\n\\n我的方案是：**纯前端 + jsonbin 存储 + GitHub Pages 部署**。\\n\\n- 用户注册、登录：本地校验 + 数据存第三方存储\\n- 扩列资料、动态、聊天：全部存同一个 JSON 结构，按字段隔离\\n- 部署：GitHub Pages，零服务器成本\\n\\n这个方案最大的好处是：不用买服务器、不用备案、不用维护后端。对于一个小圈子自娱自乐的应用，完全够用。\\n\\n## 遇到的坑\\n\\n开发过程中踩了不少坑：\\n\\n1. **第三方存储有次数限制**——免费版每月大概一万次请求，人一多就不够用了。这也是我后来开始研究 Vue + Django + MySQL 全栈版的原因。\\n2. **非实时聊天**——因为没有 WebSocket，聊天只能做成\\\"刷新页面获取新消息\\\"的模式。\\n3. **支付合规**——个人没有商户资质，做不了自动扣款，只能走\\\"赞赏码+人工审核\\\"的流程。\\n\\n## 收获\\n\\n这个项目让我彻底想明白了一件事：**技术选型不是越高级越好，而是越合适越好**。对于一个个人项目，能在成本、体验、复杂度之间找到平衡点，就是好的方案。\\n\\n微圈扩列已经上线，欢迎来玩：jiye-circle\"},{\"id\":\"reading-list\",\"slug\":\"reading-list\",\"title\":\"阅读是最便宜的旅行：今年读过的十本好书推荐\",\"type\":\"post\",\"date\":\"2026-05-30 19:30:00\",\"cover\":\"/avatar.jpg\",\"content\":\"## 为什么说阅读是最便宜的旅行\\n\\n只需要几十块钱，就能和一个伟大的灵魂对话几个小时。没有比这更划算的旅费了。\\n\\n## 上半年书单精选\\n\\n**文学类**\\n\\n《夜晚的潜水艇》——陈春成的短篇小说集，想象力像放烟花一样。看完之后好几天都缓不过来。\\n\\n《克拉拉与太阳》——石黑一雄。一个机器人的视角，讲的却是最人类的事。\\n\\n**社科类**\\n\\n《置身事内》——理解中国经济的一本好书，深入浅出，推荐给所有对现实世界好奇的人。\\n\\n《工作、消费主义和新穷人》——读完会对\\\"消费\\\"这件事有全新的认识。\\n\\n**技术类**\\n\\n《代码整洁之道》——虽然是老书了，但每次重读都有新收获。程序员必读。\\n\\n《重来》——关于创业和工作的反常识思考，薄薄一本，全是干货。\\n\\n**散文类**\\n\\n《人间草木》——汪曾祺。读他的文章，觉得生活特别值得过。\\n\\n《冬牧场》——李娟。在新疆牧场的生活记录，辽阔又温柔。\\n\\n## 读书的一点心得\\n\\n读书不一定要记住所有内容。那些读过的书，就像吃过的饭，虽然记不清每一顿吃了什么，但它们长成了你的骨头和肉。\\n\\n下半年继续，也欢迎给我推荐书。\"},{\"id\":\"slow-down\",\"slug\":\"slow-down\",\"title\":\"慢下来，才能走得更远：写给所有焦虑过的人\",\"type\":\"post\",\"date\":\"2026-08-20 21:30:00\",\"cover\":\"/bg1.jpg\",\"content\":\"## 一篇迟到的随想\\n\\n最近整理相册，翻到很多旅行时随手拍的照片。有一张特别普通：路边一棵树，阳光透过叶子洒下来，地上是斑驳的光影。我当时停下来看了很久，却完全不记得按下快门时在想什么。\\n\\n## 我们都在赶路\\n\\n身边的人好像都在加速。考证、跳槽、买房、上岸，每个词都带着一股催促的劲儿。我也曾经这样，总觉得慢一步就会被落下。\\n\\n直到有一天连续熬了三个通宵剪片子，在剪辑台前突然一阵心悸。那一刻我意识到，我可能把自己跑得太快了。\\n\\n## 慢一点，看见了什么\\n\\n开始刻意放慢节奏之后，我发现自己看见了以前完全注意不到的东西：\\n\\n- 路边早餐店的老板娘，会记得每个熟客的口味\\n- 傍晚菜市场收摊的时候，摊主们互相聊天的样子特别鲜活\\n- 夜跑时头顶的云，每天都不一样\\n\\n生活不是一场竞速比赛，而是一段需要慢慢品味的旅程。\\n\\n## 结尾\\n\\n慢下来，才能看见路边的花开，听见风吹过树叶的声音，感受到阳光洒在脸上的温度。\\n\\n这篇随笔，写给所有和我一样，曾经焦虑过的人。\"},{\"id\":\"travel-photo\",\"slug\":\"travel-photo\",\"title\":\"从江南到西北：一个人的旅行摄影笔记\",\"type\":\"post\",\"date\":\"2026-07-15 14:00:00\",\"cover\":\"/bg1.jpg\",\"content\":\"## 出发\\n\\n带了两台相机、五个镜头，计划走一个月。路线很简单：从江南出发，一路向西到西北。\\n\\n## 江南：水做的城市\\n\\n在乌镇住了三晚，每天清晨六点起来拍晨雾里的河道。摇橹船划过水面，船夫会冲我喊一声\\\"早啊\\\"。在小巷子里迷路是常有的事，但每一处转角都值得。\\n\\n## 中原：历史和麦田\\n\\n路过洛阳的时候正好赶上麦收，一望无际的金色麦田，收割机在远处轰鸣。古都的厚重感不只在博物馆里，也在这些日复一日的农事里。\\n\\n## 西北：风与沙的辽阔\\n\\n到了甘肃，第一感觉是空旷。戈壁滩上开两个小时车，景色几乎不变。但正是这种重复，让你突然意识到自己的渺小，也突然觉得很多想不开的事都没什么大不了。\\n\\n在鸣沙山等日落，风很大，沙子打在脸上有点疼。看着太阳一点点沉进沙丘后面，那一瞬间觉得，这趟路没白走。\\n\\n## 关于摄影的一些想法\\n\\n拍了将近一万张照片，最后精选出来的不过百来张。但这就是摄影：绝大多数时候都在错过，但只要有一张留住了一个瞬间，就值得了。\\n\\n精选的照片整理成了相册，放在博客的照片墙里，欢迎去看。\"}],\"chatters\":[{\"id\":\"2026-08-30-filming\",\"slug\":\"2026-08-30-filming\",\"title\":\"《城市边缘》拍摄笔记\",\"type\":\"chatter\",\"date\":\"2026-08-30\",\"cover\":null,\"content\":\"今天收工早，写点杂谈。\\n\\n《城市边缘》拍了三个月，走了很多以前从没去过的地方。凌晨的菜市场、地下通道、城中村……每一个角落都有故事。\\n\\n有个收废品的阿姨，聊到女儿考上大学，眼睛一下子就亮了。\\n\\n这些瞬间，就是我坚持拍下去的理由。\"},{\"id\":\"2026-09-06-new-blog\",\"slug\":\"2026-09-06-new-blog\",\"title\":\"换新博客啦\",\"type\":\"chatter\",\"date\":\"2026-09-06\",\"cover\":null,\"content\":\"折腾了一下午，把博客换成了新的毛玻璃风格。\\n\\n把之前做的所有项目都整理进了「项目矩阵」页面：星语信箱、微圈扩列、匿名提问箱、手环棋牌……每一个都是踩了无数坑才做出来的。\\n\\n文章也搬过来了，包括一些旅行、拍摄和生活随笔。\\n\\n希望这个小站能一直更新下去。\"}],\"moments\":[{\"id\":\"moment-ruoyan-001\",\"slug\":\"moment-ruoyan-001\",\"title\":\"\",\"type\":\"moment\",\"date\":\"2026-09-06T20:00:00.000Z\",\"cover\":null,\"content\":\"把博客换成了新的毛玻璃风格，折腾了一下午，终于把全部项目都放上去了。这个配色我自己很喜欢。\"},{\"id\":\"moment-ruoyan-002\",\"slug\":\"moment-ruoyan-002\",\"title\":\"\",\"type\":\"moment\",\"date\":\"2026-09-02T14:30:00.000Z\",\"cover\":null,\"content\":\"最近在整理《城市边缘》的素材，凌晨四点去拍菜市场。城市苏醒之前的样子，安静得不像话。\"},{\"id\":\"moment-ruoyan-003\",\"slug\":\"moment-ruoyan-003\",\"title\":\"\",\"type\":\"moment\",\"date\":\"2026-08-28T22:10:00.000Z\",\"cover\":null,\"content\":\"星语信箱上线了。每个朋友都有自己的匿名提问箱，有人已经开始偷偷问我问题，那种\\\"猜到是谁又不敢确定\\\"的感觉太好玩了。\"}]}],[\"$L20\",\"$L21\",\"$L22\",\"$L23\"],\"$L24\"]}]\n"])</script><script>self.__next_f.push([1,"25:[]\n13:\"$W25\"\n14:[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$L26\",null,{\"children\":\"$L27\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$L28\",null,{\"children\":[\"$\",\"$29\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L2a\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}]\n16:[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ruoyan-xinghui-blog/_next/static/chunks/145o.lsi86g0w.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n17:[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/ruoyan-xinghui-blog/_next/static/chunks/066jf0nk75nic.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n18:[\"$\",\"link\",\"2\",{\"rel\":\"stylesheet\",\"href\":\"/ruoyan-xinghui-blog/_next/static/chunks/0~ydk.tni6snc.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n19:[\"$\",\"link\",\"3\",{\"rel\":\"stylesheet\",\"href\":\"/ruoyan-xinghui-blog/_next/static/chunks/0fbm689bsq0d_.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"2b:I[97367,[\"/ruoyan-xinghui-blog/_next/static/chunks/0ph0hub54gnw..js\",\"/ruoyan-xinghui-blog/_next/static/chunks/05j~7ltvhvxdq.js\",\"/ruoyan-xinghui-blog/_next/static/chunks/00-csyj9a6t-x.js\"],\"OutletBoundary\"]\n20:[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ruoyan-xinghui-blog/_next/static/chunks/0-y7.kz1~5qzw.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n21:[\"$\",\"script\",\"script-0\",{\"src\":\"/ruoyan-xinghui-blog/_next/static/chunks/0xe__zmlqbcse.js
